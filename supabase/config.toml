project_id = "crook-demo"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
[db]
port = 54322
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[studio]
enabled = true
port = 54323
[analytics]
# Docker Desktop's daemon is not exposed on insecure TCP/2375. Core services do not require Logflare/Vector.
enabled = false
[local_smtp]
enabled = true
port = 54324
[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/recuperar"]
enable_signup = false
minimum_password_length = 12
[auth.email]
enable_confirmations = true
[functions.manage-buyer]
verify_jwt = true
